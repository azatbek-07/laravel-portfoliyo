<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#18121e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Dark Noir Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1020" cy="120" r="280" fill="url(#glow1)"/>
  <circle cx="160" cy="560" r="260" fill="url(#glow2)"/>

  <!-- Subtle detective grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- Navbar -->
  <g transform="translate(80, 36)">
    <rect x="0" y="0" width="44" height="44" rx="12" fill="url(#btn)"/>
    <!-- Magnifying glass icon -->
    <circle cx="20" cy="20" r="8" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="26" y1="26" x2="32" y2="32" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="58" y="31" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="900" fill="#f8fafc">Zehn<tspan fill="#f59e0b">Noir</tspan></text>

    <!-- Right nav buttons -->
    <rect x="780" y="4" width="95" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="827" y="28" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Kirish</text>

    <rect x="888" y="4" width="152" height="38" rx="19" fill="url(#btn)"/>
    <text x="964" y="28" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Tergovni boshlash</text>
  </g>

  <!-- Detective Badge -->
  <g transform="translate(390, 118)">
    <rect width="420" height="36" rx="18" fill="#111827" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="24" cy="18" r="5" fill="#f59e0b"/>
    <text x="40" y="23" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1">
      <tspan fill="#fbbf24" font-weight="800">Intellektual Tergov</tspan> • Video-Keyslar • Online
    </text>
  </g>

  <!-- Hero Title -->
  <text x="600" y="225" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="58" font-weight="900" fill="#f8fafc">
    Dalillarni <tspan fill="url(#gold)">tahlil qil</tspan>,
  </text>
  <text x="600" y="294" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="58" font-weight="900" fill="#f8fafc">
    haqiqatni och!
  </text>

  <!-- Subtitle -->
  <text x="600" y="342" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" fill="#94a3b8">
    🔍 Murakkab detektiv delolar, video-keyslar va mantiqiy tahlil platformasi
  </text>

  <!-- CTA Buttons -->
  <g transform="translate(365, 372)">
    <rect x="0" y="0" width="235" height="52" rx="26" fill="url(#btn)" filter="url(#shadow)"/>
    <text x="117" y="32" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">🕵️‍♂️ Tergovni boshlash</text>

    <rect x="251" y="0" width="220" height="52" rx="26" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text x="361" y="32" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Delolarni ko'rish</text>
  </g>

  <!-- 4 Dark Noir Feature Cards -->
  <g transform="translate(120, 465)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="222" height="135" rx="20" fill="#111827" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="91" y="18" width="40" height="40" rx="12" fill="#f59e0b" fill-opacity="0.15"/>
      <circle cx="111" cy="38" r="8" fill="#f59e0b"/>
      <text x="111" y="90" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="800" fill="#f8fafc">Delolar</text>
      <text x="111" y="114" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">MAXFIY TERGOV ARXIVI</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(246, 0)">
      <rect width="222" height="135" rx="20" fill="#111827" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="91" y="18" width="40" height="40" rx="12" fill="#ef4444" fill-opacity="0.15"/>
      <circle cx="111" cy="38" r="8" fill="#ef4444"/>
      <text x="111" y="90" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="800" fill="#f8fafc">Video-Keyslar</text>
      <text x="111" y="114" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">INTERAKTIV DALILLAR</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(492, 0)">
      <rect width="222" height="135" rx="20" fill="#111827" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="91" y="18" width="40" height="40" rx="12" fill="#38bdf8" fill-opacity="0.15"/>
      <circle cx="111" cy="38" r="8" fill="#38bdf8"/>
      <text x="111" y="90" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="800" fill="#f8fafc">Mantiq</text>
      <text x="111" y="114" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">CHUQUR TAHLIL VA XULOSA</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(738, 0)">
      <rect width="222" height="135" rx="20" fill="#111827" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="91" y="18" width="40" height="40" rx="12" fill="#10b981" fill-opacity="0.15"/>
      <circle cx="111" cy="38" r="8" fill="#10b981"/>
      <text x="111" y="90" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="800" fill="#f8fafc">Reyting</text>
      <text x="111" y="114" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">ENG KUCHLI DETEKTIVLAR</text>
    </g>
  </g>
</svg>
