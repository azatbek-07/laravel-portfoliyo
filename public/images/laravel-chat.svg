  <text x="466" y="200" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#f1f5f9">Salom! Real-time chat tizimi tayyor bo'ldimi?</text>
  <text x="466" y="226" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#94a3b8">14:20</text>

