  <rect x="442" y="376" width="380" height="76" rx="20" fill="#1e293b"/>
  <text x="466" y="408" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#f1f5f9">Ajoyib! Interfeys ham juda tez ishlayapti 🔥</text>
  <text x="466" y="434" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#94a3b8">14:22</text>

  <!-- Input Bar -->
  <rect x="442" y="532" width="548" height="52" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="468" y="563" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#64748b">Xabar yozing...</text>
  <rect x="1006" y="532" width="90" height="52" rx="16" fill="url(#accent)"/>
  <text x="1051" y="563" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Yuborish</text>
