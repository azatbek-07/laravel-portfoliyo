  <text x="164" y="322" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">Backend Team</text>
  <text x="164" y="344" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748b">Yangi xabar keldi</text>

  <rect x="96" y="380" width="258" height="72" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="132" cy="416" r="20" fill="#10b981"/>
  <text x="164" y="410" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">Sardor</text>
  <text x="164" y="432" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748b">Rahmat, zo'r chiqibdi!</text>

  <!-- Right Chat Window -->
  <rect x="406" y="60" width="724" height="555" rx="24" fill="#111827" stroke="#1e293b" stroke-width="2"/>
  <line x1="406" y1="132" x2="1130" y2="132" stroke="#1e293b" stroke-width="2"/>
  <circle cx="452" cy="96" r="20" fill="#6366f1"/>
  <text x="486" y="92" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Real-Time Messenger</text>
  <text x="486" y="112" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#10b981">● Faol ulanish • Laravel + MySQL</text>

