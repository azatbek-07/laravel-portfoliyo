      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1020" cy="120" r="240" fill="#6366f1" opacity="0.12"/>
  <circle cx="180" cy="560" r="220" fill="#06b6d4" opacity="0.12"/>

  <!-- Left Sidebar Mockup -->
  <rect x="70" y="60" width="310" height="555" rx="24" fill="#111827" stroke="#1e293b" stroke-width="2"/>
  <text x="102" y="112" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="800" fill="#f8fafc">Laravel<tspan fill="#38bdf8">Chat</tspan></text>
  <circle cx="340" cy="104" r="6" fill="#10b981"/>

  <rect x="96" y="140" width="258" height="42" rx="12" fill="#1e293b"/>
