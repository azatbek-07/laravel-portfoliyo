  <text x="164" y="234" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Azatbek</text>
  <text x="164" y="256" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#38bdf8">Online • yozmoqda...</text>

  <rect x="96" y="292" width="258" height="72" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
