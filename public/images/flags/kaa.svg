  <!-- Lower red stripe -->
  <rect width="250" height="5" y="75.5" fill="#EE1620"/>
  <!-- Lower white fimbriation -->
  <rect width="250" height="2.5" y="80.5" fill="#FFFFFF"/>
  <!-- Green bottom stripe -->
