    <polygon points="55,22.5 56.3,26.5 60.5,26.5 57.1,29 58.4,33 55,30.5 51.6,33 52.9,29 49.5,26.5 53.7,26.5"/>
    <polygon points="69,22.5 70.3,26.5 74.5,26.5 71.1,29 72.4,33 69,30.5 65.6,33 66.9,29 63.5,26.5 67.7,26.5"/>
    <polygon points="83,22.5 84.3,26.5 88.5,26.5 85.1,29 86.4,33 83,30.5 79.6,33 80.9,29 77.5,26.5 81.7,26.5"/>
