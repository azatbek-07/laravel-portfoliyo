<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Rounded Navy Background -->
  <rect width="128" height="128" rx="28" fill="#0a192f"/>
  <!-- Glowing Hexagon Outline -->
  <polygon points="64,12 110,38 110,90 64,116 18,90 18,38" fill="#112240" stroke="url(#hexGrad)" stroke-width="5" stroke-linejoin="round"/>
  <!-- AE Letters -->
  <text x="45" y="79" text-anchor="middle" font-family="Inter, DejaVu Sans, system-ui, sans-serif" font-size="42" font-weight="900" fill="#ffffff">A</text>
  <text x="83" y="79" text-anchor="middle" font-family="Inter, DejaVu Sans, system-ui, sans-serif" font-size="42" font-weight="900" fill="#00d4ff">E</text>
</svg>
